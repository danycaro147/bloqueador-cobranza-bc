plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.danycaro.bloqueadorcobranza"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.danycaro.bloqueadorcobranza"
        // Android 10+: necesario para el rol de filtro de llamadas (RoleManager).
        minSdk = 29
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Firma de depuración para que "flutter build apk" funcione sin configurar llaves.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
