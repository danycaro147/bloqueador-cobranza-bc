name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Compilar
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            grep -E "error|Error|ERROR|What went wrong|FAILURE|Exception|e: " build.log | head -60 > err.txt
            tail -40 build.log >> err.txt
            msg=$(sed -e 's/%/%25/g' err.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=BUILDLOG::$msg"
            exit 1
          }
      - run: cp build/app/outputs/flutter-apk/app-release.apk BloqueadorCobranza.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BloqueadorCobranza-apk
          path: BloqueadorCobranza.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bloqueador Cobranza ${{ github.run_number }}
          files: BloqueadorCobranza.apk
